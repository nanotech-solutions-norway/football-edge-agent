name: R0 Reconciliation Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  r0-hardening:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      FEA_PIP_CONTRACT_SHA256: f7ff84079db761aaaf1f016c3c866df34c2ba1f70e09b871ea0a277860a60cbd
      R0_SYNTHETIC_PAYLOAD_SHA256: 7b30d9be5f114ecbd83e3becf4ef350778b984c0ed0cd4b96de04cd0aaa61d61
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate shared contract integrity and taxonomy
        run: |
          python -c "import hashlib,json,os,pathlib; p=pathlib.Path('contracts/fea_pip_shadow_contract_v2.schema.json'); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['FEA_PIP_CONTRACT_SHA256']; d=json.loads(p.read_text()); assert d['properties']['market']['enum']==['1X2','OVER_UNDER_2_5','BTTS']; assert d['allOf'][0]['else']['properties']['probabilities']['maxItems']==0; print('shared-contract-integrity-ok')"
      - name: Preserve hard execution lock
        run: python -c "from backend.app.services.auto_betting_service import get_auto_betting_status; s=get_auto_betting_status(); assert s['hard_locked'] is True; assert s['enabled'] is False; print('fea-execution-lock-ok')"
      - name: Validate synthetic cross-repository shadow fixture
        run: |
          python -c "import hashlib,json,os,pathlib; from backend.app.services.pip_shadow_contract import validate_shadow_payload; p=pathlib.Path('examples/r0_shadow_payload.synthetic.json'); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['R0_SYNTHETIC_PAYLOAD_SHA256']; d=json.loads(p.read_text()); r=validate_shadow_payload(d); assert r.valid, r.errors; assert d['data_quality']['consensus_status']=='comparable_consensus'; assert d['safety']['execution_allowed'] is False; assert d['safety']['recommendation_release_allowed'] is False; print('synthetic-cross-repo-shadow-ok')"
      - name: Compile R0 Python modules and offline runners
        run: python -m compileall -q backend scripts
      - name: Run current FEA tests
        run: python -m pytest -q
