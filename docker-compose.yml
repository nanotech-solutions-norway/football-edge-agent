services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_edge
      POSTGRES_USER: football_edge_user
      POSTGRES_PASSWORD: replace_with_password
    ports:
      - "5432:5432"
    volumes:
      - football_edge_pgdata:/var/lib/postgresql/data
      - ./backend/app/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  football_edge_pgdata:
